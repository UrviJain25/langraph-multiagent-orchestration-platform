<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-header">
        <h2>Workflows</h2>
        <button id="newWorkflowBtn">+ New</button>
      </div>

      <div id="workflowList" class="workflow-list">
        <div class="empty-state">
          <p>🗂️</p>
          <p>No workflows yet.<br>Start one on the right.</p>
        </div>
      </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <div class="top-section">

        <h1>Workflow Console</h1>

        <div class="query-box">
          <textarea
            id="queryInput"
            placeholder="Describe your task — e.g. 'Write a function to sort a list' or 'Research transformer models'..."
          ></textarea>

          <div class="query-box-footer">
            <span id="inlineError" class="inline-error hidden"></span>
            <button id="startBtn">
              <div id="btnSpinner" class="spinner"></div>
              <span id="btnText">Start Workflow</span>
            </button>
          </div>
        </div>

      </div>

      <!-- WORKFLOW DETAIL -->
      <div id="workflowSection" class="workflow-section hidden">

        <div class="workflow-top">
          <div>
            <h2 id="workflowTitle">Workflow</h2>
            <p id="requestIdText"></p>
          </div>
          <div class="workflow-top-right">
            <span id="agentBadge" class="agent-badge hidden"></span>
            <span id="statusBadge" class="status-badge status-pending">pending</span>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <h3>Status</h3>
            <p id="statusText">—</p>
          </div>
          <div class="card">
            <h3>Agent</h3>
            <p id="agentText">—</p>
          </div>
          <div class="card">
            <h3>Approval</h3>
            <p id="approvalStatus">—</p>
          </div>
          <div class="card">
            <h3>Retries</h3>
            <p id="retryCount">0</p>
          </div>
        </div>

        <div class="output-card">
          <div class="output-card-header">
            <h3>Final Output</h3>
            <button class="copy-btn" id="copyOutputBtn">Copy</button>
          </div>
          <pre id="finalOutput">No output yet</pre>
        </div>

        <div id="errorCard" class="output-card hidden">
          <div class="output-card-header">
            <h3>Error</h3>
          </div>
          <pre id="errorOutput"></pre>
        </div>

        <div id="actionButtons" class="actions hidden">
          <button id="approveBtn" class="approve-btn">Approve</button>
          <button id="rejectBtn" class="reject-btn">Reject</button>
        </div>

      </div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
